---
AWSTemplateFormatVersion: "2010-09-09"
Description: EmartStore EC2 instances stack - Webservers

Parameters:
  Env:
    Description: Environment name
    Type: String
    Default: DEV
    AllowedValues:
      - DEV
      - STAGE
      - PROD

  AMIID:
    Type: AWS::EC2::Image::Id
    Default: ami-0ec10929233384c7f

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: cloudchaps_resorts_keypair

  InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.micro
      - t2.small
      - t2.medium

Transform: AWS::LanguageExtensions

Resources:
  'Fn::ForEach::EC2Instances':
    - InstanceId
    - ["1", "2", "3"]
    - 'ESFrontEndServer${InstanceId}':
        Type: AWS::EC2::Instance
        Properties:
          InstanceType: !Ref InstanceType
          ImageId: !Ref AMIID
          SubnetId:
            Fn::ImportValue: !Sub "${Env}-emartstore-dev-vpc-PublicSubnet-1-ID"
          SecurityGroupIds:
            - Fn::ImportValue: !Sub "${Env}-WEB-SG-ID"
          KeyName: !Ref KeyName
          Tags:
            - Key: Name
              Value: !Sub "${Env}-FrontEndServer${InstanceId}"
            - Key: Project
              Value: CloudChaps
            - Key: Environment
              Value: !Ref Env
            - Key: Owner
              Value: !Ref AWS::AccountId
          UserData:
            Fn::Base64:
              !Sub
                |
              #!/bin/bash
              set -e

              # Detect package manager and install web server + ec2 metadata utils
              if command -v apt &>/dev/null; then
                apt update -y
                apt install -y apache2 amazon-ec2-utils
                systemctl start apache2 && systemctl enable apache2
                WEB_ROOT="/var/www/html"
              elif command -v dnf &>/dev/null; then
                dnf update -y
                dnf install -y httpd ec2-metadata
                systemctl start httpd && systemctl enable httpd
                WEB_ROOT="/var/www/html"
              elif command -v yum &>/dev/null; then
                yum update -y
                yum install -y httpd ec2-metadata
                systemctl start httpd && systemctl enable httpd
                WEB_ROOT="/var/www/html"
              else
                echo "Unsupported package manager" && exit 1
              fi

              # Get EC2 instance metadata
              INSTANCE_ID=$(ec2-metadata --instance-id | cut -d " " -f 2)
              INSTANCE_TYPE=$(ec2-metadata --instance-type | cut -d " " -f 2)
              AVAIL_ZONE=$(ec2-metadata --availability-zone | cut -d " " -f 2)
              PRIVATE_IP=$(ec2-metadata --local-ipv4 | cut -d " " -f 2)
              PUBLIC_IP=$(ec2-metadata --public-ipv4 | cut -d " " -f 2)

              # Persist environment variables system-wide
              cat >> /etc/environment <<ENVEOF
              INSTANCE_ID=$INSTANCE_ID
              INSTANCE_TYPE=$INSTANCE_TYPE
              AVAIL_ZONE=$AVAIL_ZONE
              PRIVATE_IP=$PRIVATE_IP
              PUBLIC_IP=$PUBLIC_IP
              ENVEOF

              # Create HTML page with EC2 info
              cat > $WEB_ROOT/index.html <<EOF
              <!DOCTYPE html>
              <html>
              <head>
                  <title>EC2 Instance Info</title>
                  <style>
                      body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin: 0; padding: 20px; }
                      .container { max-width: 800px; margin: 50px auto; background: white; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); padding: 40px; }
                      h1 { color: #333; text-align: center; margin-bottom: 30px; }
                      .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
                      .info-card { background: #f8f9fa; padding: 20px; border-radius: 8px; border-left: 4px solid #667eea; }
                      .label { font-weight: bold; color: #667eea; font-size: 14px; text-transform: uppercase; }
                      .value { font-size: 18px; color: #333; margin-top: 5px; word-break: break-all; }
                      .footer { text-align: center; margin-top: 30px; color: #666; font-size: 14px; }
                  </style>
              </head>
              <body>
                  <div class="container">
                      <h1>🚀 EC2 Instance Information</h1>
                      <div class="info-grid">
                          <div class="info-card">
                              <div class="label">Instance ID</div>
                              <div class="value">$INSTANCE_ID</div>
                          </div>
                          <div class="info-card">
                              <div class="label">Instance Type</div>
                              <div class="value">$INSTANCE_TYPE</div>
                          </div>
                          <div class="info-card">
                              <div class="label">Availability Zone</div>
                             <div class="value">$AVAIL_ZONE</div>
                          </div>
                          <div class="info-card">
                              <div class="label">Private IP</div>
                              <div class="value">$PRIVATE_IP</div>
                          </div>
                      <div class="info-card">
                      <div class="label">Public IP</div>
                      <div class="value">$PUBLIC_IP</div>
                  </div>
                  <div class="info-card">
                      <div class="label">Hostname</div>
                      <div class="value">$(hostname -f)</div>
                  </div>
              </div>
              <div class="footer">AWS CloudChaps Training Instance</div>
               </div>
              </body>
              </html>
              EOF
              
Outputs:
  FrontEndServer1InstanceId:
    Description: InstanceId of FrontEnd Server 1
    Value: !Ref ESFrontEndServer1
    Export:
      Name: !Sub "${Env}-ESFrontEndServer1-InstanceId"

  FrontEndServer2InstanceId:
    Description: InstanceId of FrontEnd Server 2
    Value: !Ref ESFrontEndServer2
    Export:
      Name: !Sub "${Env}-ESFrontEndServer2-InstanceId"

  FrontEndServer3InstanceId:
    Description: InstanceId of FrontEnd Server 3
    Value: !Ref ESFrontEndServer3
    Export:
      Name: !Sub "${Env}-ESFrontEndServer3-InstanceId"
  
  FrontEndServerPrivateIP1:
    Description: Private IP address of the FrontEnd Server
    Value: !GetAtt ESFrontEndServer1.PrivateIp
    Export:
      Name: !Sub "${Env}-WEBServerPrivateIP1"
  
  FrontEndServerPrivateIP2:
    Description: Private IP address of the FrontEnd Server
    Value: !GetAtt ESFrontEndServer2.PrivateIp
    Export:
      Name: !Sub "${Env}-WEBServerPrivateIP2"

  FrontEndServerPrivateIP3:
    Description: Private IP address of the FrontEnd Server
    Value: !GetAtt ESFrontEndServer3.PrivateIp
    Export:
      Name: !Sub "${Env}-WEBServerPrivateIP3"
  